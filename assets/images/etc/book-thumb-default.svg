  <!-- The 4:5 canvas and front-cover area match book-thumb-default.svg. -->
  <path d="M22 12h124c5.5 0 8 3.2 8 8v167c0 6-3 9-9 9H22c-8.5 0-14-5.4-14-13V25c0-7.6 5.2-13 14-13Z" fill="url(#back)" stroke="#071b34" stroke-width=".8"/>
  <path d="M146 14c4.2 0 6 2.6 6 7v166c0 4.8-2.3 7-7 7H23c-6.2 0-10.3-2.9-11.7-7" stroke="#5081ac" stroke-opacity=".55" stroke-width=".8"/>

  <!-- Individually curved page edges follow the rounded cover corner. -->
  <path d="M24 17h118l8 5v160c0 6.6-2.5 9-9 9H24c-6.5 0-10-2.7-10-8V28c0-6.8 3.6-11 10-11Z" fill="url(#paper)" stroke="#c7b795" stroke-width=".5"/>
  <path d="M139 18h3l8 4v160c0 6.6-2.5 9-9 9h-5c8-3 9-6 9-13V25Z" fill="url(#paper-edge)"/>
  <g stroke="#ab9872" stroke-linecap="round">
    <path d="M145.1 21v154c0 6.6-2.2 9-9 9H23" stroke-opacity=".45" stroke-width=".45"/>
    <path d="M146.5 22v154.5c0 6.4-2.5 9-9 9H20" stroke-opacity=".35" stroke-width=".35"/>
    <path d="M147.7 23v155c0 6.2-2.7 9-9 9H19" stroke-opacity=".4" stroke-width=".4"/>
    <path d="M148.7 24v155.5c0 6.5-2.8 9-9 9H21" stroke-opacity=".4" stroke-width=".35"/>
    <path d="M149.3 26v155c0 6.1-2.5 8.8-9 8.8H24" stroke-opacity=".32" stroke-width=".3"/>
  </g>
  <path d="M146 24v153c0 5.8-2.3 8-8 8H22m125.2-158v151c0 5.7-2.5 8-8 8H20m128.2-159v152.7c0 5.6-2.4 8-8 8H22" stroke="#fffdf3" stroke-opacity=".75" stroke-width=".45"/>
  <path d="M23 181h112c6.2 0 9-2.3 10-7v4c0 5.2-3.7 7-10 7H23Z" fill="#78674d" fill-opacity=".18"/>

  <!-- Leather cover: layered gradients, a fine vector grain, and a soft bevel. -->
  <use href="#front-shape" fill="url(#cover)"/>
  <use href="#front-shape" fill="url(#cover-light)"/>
  <use href="#front-shape" fill="url(#grain)" opacity=".65"/>
  <path d="M27 5h108.5c4.7 0 7.3 2.8 7.3 7.4V174c0 4.7-2.5 7-7.3 7H27" stroke="url(#rim)" stroke-width=".9"/>
  <path d="M28 6.7h107c3.7 0 6.1 2.1 6.1 6.4V173c0 4-2.1 6.1-6.1 6.1H28" stroke="#041b36" stroke-opacity=".2" stroke-width=".55"/>
  <path d="M29 5.6h105.5c4.3 0 6.9 2 7.3 5.7" stroke="#d8ecfa" stroke-opacity=".36" stroke-width=".5" stroke-linecap="round"/>
  <path d="M28 182h108c5.4 0 8-2.8 8-8" stroke="#03142b" stroke-opacity=".75" stroke-width=".9"/>

  <!-- Rounded spine, recessed hinge, and the leather turn-in at the foot. -->
  <use href="#spine-shape" fill="url(#spine)"/>
  <use href="#spine-shape" fill="url(#grain)" opacity=".5"/>
  <path d="M9.2 177V18c0-7.4 6.1-12.8 14-12.8" stroke="#79afd4" stroke-opacity=".65" stroke-width=".7" stroke-linecap="round"/>
  <path d="M24 5.5h2.5V181H24Z" fill="url(#hinge)"/>
  <path d="M26.7 7v171" stroke="#a6cce7" stroke-opacity=".55" stroke-width=".65"/>
  <path d="M10 183c2.6-3.5 7.3-5.6 14-5.6v4.4c-6.2 0-10.1 2.2-10.1 6 0 3.3 3.8 5.9 10.1 5.9H141v1.3H23c-8.1 0-13-4.1-13-12Z" fill="url(#back)"/>
  <path d="M10.7 183.2c2.7-3 6.6-4.6 12.3-4.6" stroke="#87b3d2" stroke-opacity=".55" stroke-width=".65" stroke-linecap="round"/>
  <path d="M15.3 187.8c0 3 3 4.7 8.7 4.7h117" stroke="#020e20" stroke-opacity=".6" stroke-width=".6"/>
</svg>
