<svg xmlns="http://www.w3.org/2000/svg" width="160" height="200" viewBox="0 0 160 200" fill="none">
  <defs>
    <linearGradient id="back" x1="12" y1="12" x2="151" y2="197" gradientUnits="userSpaceOnUse">
      <stop stop-color="#294e7c"/>
      <stop offset=".46" stop-color="#12365f"/>
      <stop offset="1" stop-color="#061a34"/>
    </linearGradient>
    <linearGradient id="paper" x1="83" y1="16" x2="83" y2="191" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffcf0"/>
      <stop offset=".78" stop-color="#f5efdc"/>
      <stop offset=".9" stop-color="#d4c5a7"/>
      <stop offset=".95" stop-color="#f8f1de"/>
      <stop offset="1" stop-color="#e4d5b6"/>
    </linearGradient>
    <linearGradient id="paper-edge" x1="139" y1="100" x2="151" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#887453" stop-opacity=".7"/>
      <stop offset=".4" stop-color="#fff9e9" stop-opacity="0"/>
      <stop offset=".8" stop-color="#fffdf4" stop-opacity=".7"/>
      <stop offset="1" stop-color="#cbb991" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="cover" x1="26" y1="5" x2="148" y2="181" gradientUnits="userSpaceOnUse">
      <stop stop-color="#346da6"/>
      <stop offset=".27" stop-color="#23568a"/>
      <stop offset=".6" stop-color="#123b6a"/>
      <stop offset="1" stop-color="#071f40"/>
    </linearGradient>
    <radialGradient id="cover-light" cx="0" cy="0" r="1" gradientTransform="translate(41 22) rotate(57) scale(137 112)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8cbee7" stop-opacity=".2"/>
      <stop offset="1" stop-color="#87bde5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spine" x1="8" y1="90" x2="27" y2="90" gradientUnits="userSpaceOnUse">
      <stop stop-color="#081c36"/>
      <stop offset=".16" stop-color="#1a426d"/>
      <stop offset=".42" stop-color="#427eaf"/>
      <stop offset=".6" stop-color="#326596"/>
      <stop offset=".84" stop-color="#173c65"/>
      <stop offset="1" stop-color="#071b35"/>
    </linearGradient>
    <linearGradient id="rim" x1="30" y1="5" x2="137" y2="181" gradientUnits="userSpaceOnUse">
      <stop stop-color="#bedff4" stop-opacity=".8"/>
      <stop offset=".38" stop-color="#7aadd2" stop-opacity=".32"/>
      <stop offset=".78" stop-color="#446f98" stop-opacity=".12"/>
      <stop offset="1" stop-color="#80a9c9" stop-opacity=".42"/>
    </linearGradient>
    <linearGradient id="hinge" x1="22" y1="90" x2="29" y2="90" gradientUnits="userSpaceOnUse">
      <stop stop-color="#04182f" stop-opacity="0"/>
      <stop offset=".4" stop-color="#04182f" stop-opacity=".9"/>
      <stop offset=".58" stop-color="#8db8d9" stop-opacity=".75"/>
      <stop offset="1" stop-color="#8db8d9" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grain" width="6" height="7" patternUnits="userSpaceOnUse">
      <path d="m.3 1.4 1-.5 1.1.3.7-.6M3.8 2.1l.8.6 1-.4M.8 4l.8.5-.2 1.2M2.7 3.3l.8 1.1 1.1.1M3.5 6.5l1-.8 1 .4" stroke="#b5d6ed" stroke-opacity=".22" stroke-width=".14" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="m.5 2.8.9.5.7-.4M3.4.6l.9.3.6-.5M.2 6.2l.7-.3.8.4M5 3.6l.5 1.2-.3.6M2.5 5.2l.6.7" stroke="#020f22" stroke-opacity=".3" stroke-width=".16" stroke-linecap="round" stroke-linejoin="round"/>
    </pattern>
    <path id="front-shape" d="M26 4h110c5.2 0 8 3.3 8 8v162c0 5.3-2.8 8-8 8H26c-1.2 0-2-.8-2-2V7c0-1.8.7-3 2-3Z"/>
    <path id="spine-shape" d="M24 4h2v178h-4c-6.9 0-12 4.5-12 10-1.3-2.2-2-5-2-8V18C8 10.2 14.6 4 24 4Z"/>
